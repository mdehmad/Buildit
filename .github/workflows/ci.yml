name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # app.html is generated from src/. If building it changes the file, the
      # commit edited the output instead of the source and the two have drifted.
      - name: Build is up to date
        run: |
          npm run build
          git diff --exit-code app.html \
            || { echo "::error::app.html is stale — run npm run build and commit it"; exit 1; }

      - run: npm test
