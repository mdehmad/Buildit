<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The landing page is landing.html, not this file.

     An artifact always serves its main page as index.html, and that main page
     is the app. Keeping the landing at the root as well would mean two copies
     of it, so the root redirects instead and there is one landing page that
     works both on the site and inside an artifact. -->
<meta http-equiv="refresh" content="0; url=landing.html">
<link rel="canonical" href="landing.html">
<title>buildIT</title>
</head>
<body>
<p>Redirecting to <a href="landing.html">buildIT</a>.</p>
</body>
</html>
